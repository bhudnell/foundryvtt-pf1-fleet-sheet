      content: >-
        <p>At the start of a battle phase, each fleet's admiral makes a
        Profession (sailor) check to determine initiative. The admiral whose
        result is higher gains the upper hand in that battle phase, which grants
        all of his squadrons a +1 bonus on attack rolls. This Profession
        (sailor) check is made at the start of each battle phase.</p>
